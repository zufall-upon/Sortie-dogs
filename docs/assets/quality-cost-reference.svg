<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">Historical Bare OpenCode versus Sortie quality–cost reference</title>
  <desc id="description">One frozen task, one trial per arm, September 10 2026. Bare: 55.6 percent task-check completion at 5.42 dollars API-equivalent cost. Sortie v0.9.5: 88.9 percent at 1.46 dollars. Both have zero of one verified passes. External systems use different methodologies and have no plotted coordinates.</desc>
  <rect width="960" height="420" rx="12" fill="#101827"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="80" y="32" fill="#f1f5f9" font-size="20" font-weight="700">Quality–cost reference · historical n=1</text>
    <text x="80" y="52" fill="#b8c4d6" font-size="12">2026-09-10 · Sortie v0.9.5 · neither arm achieved Verified PASS</text>
    <g stroke="#334155" stroke-width="1">
      <path d="M80 70H620M80 130H620M80 190H620M80 250H620M80 310H620"/>
      <path d="M80 70V310M260 70V310M440 70V310M620 70V310"/>
    </g>
    <path d="M80 64V310H634" fill="none" stroke="#d1d9e6" stroke-width="2"/>
    <g fill="#b8c4d6" font-size="12" text-anchor="end">
      <text x="68" y="74">100%</text><text x="68" y="134">75%</text>
      <text x="68" y="194">50%</text><text x="68" y="254">25%</text><text x="68" y="314">0%</text>
    </g>
    <g fill="#b8c4d6" font-size="12" text-anchor="middle">
      <text x="80" y="331">$0</text><text x="260" y="331">$2</text>
      <text x="440" y="331">$4</text><text x="620" y="331">$6</text>
    </g>
    <text transform="translate(22 250) rotate(-90)" fill="#d1d9e6" font-size="13">Task-check completion ↑</text>
    <text x="80" y="360" fill="#d1d9e6" font-size="13">Estimated API-equivalent total cost →</text>
    <circle cx="211.45" cy="96.67" r="7" fill="#fb923c"/>
    <text x="226" y="88" fill="#fdba74" font-size="16" font-weight="700">Sortie v0.9.5</text>
    <text x="226" y="109" fill="#d1d9e6" font-size="13">$1.46 · 8/9 task checks</text>
    <circle cx="567.88" cy="176.67" r="7" fill="#60a5fa"/>
    <text x="552" y="157" fill="#93c5fd" font-size="16" font-weight="700" text-anchor="end">Bare OpenCode</text>
    <text x="552" y="198" fill="#d1d9e6" font-size="13" text-anchor="end">$5.42 · 5/9 task checks</text>
    <rect x="676" y="70" width="254" height="240" rx="8" fill="#172133" stroke="#334155"/>
    <text x="694" y="100" fill="#a0adbf" font-size="14" font-weight="600">Separate-methodology references</text>
    <g fill="#8190a5" font-size="15">
      <text x="698" y="142">Codex</text><text x="698" y="173">Pi</text><text x="698" y="204">Oh My OpenCode</text>
    </g>
    <text x="694" y="248" fill="#a0adbf" font-size="12">Not plotted: no comparable</text>
    <text x="694" y="267" fill="#a0adbf" font-size="12">cost / quality coordinates.</text>
    <text x="80" y="397" fill="#fbbf24" font-size="13">Quality issues remain. Latest qualification did not finish; new benchmarks are frozen.</text>
  </g>
</svg>
